<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24443A">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="H&amp;P Owner">
<meta name="format-detection" content="telephone=no">
<title>Harbor &amp; Pine Owner View</title>
<style>
  :root {
    --pine: #24443A; --pine-dark: #1B2B24; --amber: #C8862A; --sand: #F4EFE6;
    --ink: #1B2B24; --muted: #5E7268; --line: #DCE3DF; --card: #FFFFFF;
    --red: #B5463C; --red-bg: #F7E3E0; --green: #2F6B4F; --green-bg: #E1EFE7; --yellow-bg: #FBF0D9;
    /* Spacing and type scale smoothly from the smallest phone (320px) to desktop */
    --gutter: clamp(12px, 4vw, 24px);
    --gap: clamp(10px, 2.6vw, 16px);
    --pad: clamp(14px, 3.8vw, 22px);
    --big: clamp(42px, 13vw, 76px);
    --val: clamp(22px, 6.5vw, 30px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--sand); color: var(--ink);
    min-height: 100vh; min-height: 100dvh; /* dvh handles iOS and Android toolbars */
    -webkit-tap-highlight-color: transparent;
  }

  /* Header stays clear of the notch / Dynamic Island / punch-hole camera */
  header {
    background: var(--pine); color: #fff; position: sticky; top: 0; z-index: 5;
    padding: calc(12px + env(safe-area-inset-top)) calc(var(--gutter) + env(safe-area-inset-right)) 12px calc(var(--gutter) + env(safe-area-inset-left));
  }
  .brand { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .brand svg { width: clamp(38px, 11vw, 54px); height: clamp(38px, 11vw, 54px); flex: none; }
  .brand h1 { font-family: Georgia, "Times New Roman", serif; font-size: clamp(18px, 5.2vw, 24px); font-weight: 700; line-height: 1.1; }
  .brand p { font-size: clamp(10px, 2.9vw, 12px); opacity: .85; letter-spacing: .04em; text-transform: uppercase; margin-top: 2px; }

  main {
    max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--gap);
    padding: var(--gap) calc(var(--gutter) + env(safe-area-inset-right)) var(--gap) calc(var(--gutter) + env(safe-area-inset-left));
  }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .bar .right { display: flex; align-items: center; gap: 8px; }
  .badge { background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 12px; white-space: nowrap; }
  .badge.demo { background: var(--yellow-bg); border-color: #E8D3A6; color: #6B4E14; }
  button { font: inherit; cursor: pointer; touch-action: manipulation; }

  /* Status + refresh: one tidy pill on the right */
  .status { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 4px 0 12px; background: #fff; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex: none; }
  .status.demo .dot { background: var(--amber); }
  .status.error .dot { background: var(--red); }
  .status.flash { border-color: var(--green); background: var(--green-bg); color: var(--green); transition: background .2s, border-color .2s; }
  .refresh:disabled { opacity: .75; cursor: default; }
  .refresh { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: var(--pine); color: #fff; font-size: 13px; font-weight: 600; }
  .refresh::after { content: ""; position: absolute; inset: -8px -4px; } /* 44px tap area without a bulky button */
  .refresh:hover { background: var(--pine-dark); }
  .refresh svg { width: 14px; height: 14px; }
  .refresh.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .badge { height: 36px; display: inline-flex; align-items: center; }

  /* Orders card opens details below it */
  button.card { width: 100%; text-align: left; font: inherit; color: inherit; }
  .stat.clickable { cursor: pointer; transition: box-shadow .15s; }
  .stat.clickable:hover { box-shadow: 0 4px 14px rgba(27,43,36,.10); }
  .more { display: inline-flex; align-items: center; gap: 4px; margin-top: 8px; font-size: 13px; font-weight: 600; color: #6B4E14; }
  .more .chev { display: inline-block; transition: transform .2s; }
  .stat[aria-expanded="true"] .more .chev { transform: rotate(180deg); }
  .orders-detail h2 { margin-bottom: 4px; }
  .orders-detail .sub { margin: 0 0 6px; }
  .order { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .order .who { font-weight: 700; font-size: 16px; }
  .order .amt { font-family: Georgia, "Times New Roman", serif; font-weight: 700; font-size: 22px; text-align: right; font-variant-numeric: tabular-nums; }
  .order .meta { grid-column: 1 / -1; font-size: 14px; color: var(--muted); }
  .order .waiting { display: inline-block; font-size: 12px; font-weight: 600; background: var(--yellow-bg); color: #6B4E14; border-radius: 999px; padding: 2px 8px; margin-left: 4px; }
  .order .btn { grid-column: 1 / -1; justify-self: start; display: inline-flex; align-items: center; min-height: 44px; padding: 10px 16px; border-radius: 10px; background: var(--pine); color: #fff; font-weight: 600; font-size: 14px; text-decoration: none; margin-top: 4px; }
  .note { font-size: 14px; color: var(--muted); padding-top: 8px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: var(--pad); min-width: 0; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); line-height: 1.3; }
  .big { font-family: Georgia, "Times New Roman", serif; font-size: var(--big); font-weight: 700; line-height: 1; margin-top: 6px; }
  .big.over { color: var(--red); } .big.ok { color: var(--green); }
  .sub { font-size: 14px; color: var(--muted); margin-top: 6px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
  .stat .label { font-size: 11px; }
  .stat .val { font-size: var(--val); font-weight: 700; margin-top: 4px; }
  .stat.alert { background: var(--yellow-bg); border-color: #E8D3A6; }
  h2 { font-size: 15px; margin-bottom: 10px; }

  table { width: 100%; border-collapse: collapse; font-size: 15px; table-layout: auto; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 6px 4px; border-bottom: 1px solid var(--line); line-height: 1.25; }
  td { padding: 10px 4px; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .pill.over { background: var(--red-bg); color: var(--red); }
  .pill.ok { background: var(--green-bg); color: var(--green); }
  .pill.wait { background: var(--yellow-bg); color: #6B4E14; }
  .short { display: none; }

  .chart svg { width: 100%; height: auto; display: block; }
  .err { background: var(--red-bg); color: var(--red); border-color: #EBC3BD; font-size: 14px; }
  footer { text-align: center; font-size: 12px; color: var(--muted); padding: 8px var(--gutter) calc(24px + env(safe-area-inset-bottom)); }

  /* ---- Breakpoints ----
     <= 359px  : smallest phones (iPhone SE 1st gen 320, older/compact Android)
     360-389px : iPhone SE 2/3, 12/13 mini (375), Galaxy S20-S25 / A-series (360-384)
     390-440px : iPhone 12-16, Plus, Pro, Pro Max (390-440), Pixel 6-9 (412), large Galaxy (412)
     441-639px : foldables (Galaxy Z Fold cover/inner, Pixel Fold), small tablets in split view
     640-959px : tablets (iPad mini/Air portrait, Android tablets)
     >= 960px  : laptops and desktops (two-column layout) */
  @media (max-width: 359px) {
    .brand p { display: none; }
    .stats { grid-template-columns: 1fr; }
    table { font-size: 13px; }
    th { font-size: 10px; letter-spacing: .03em; }
    td { padding: 9px 2px; } th { padding: 6px 2px; }
    .pill { font-size: 11px; padding: 2px 6px; }
    .long { display: none; } .short { display: inline; }
    .bar { font-size: 12px; }
  }
  @media (min-width: 360px) and (max-width: 389px) {
    table { font-size: 14px; }
    td { padding: 10px 3px; } th { padding: 6px 3px; }
    .pill { font-size: 11px; padding: 3px 7px; }
    .long { display: none; } .short { display: inline; }
  }
  @media (min-width: 390px) and (max-width: 440px) {
    table { font-size: 15px; }
  }
  @media (min-width: 441px) and (max-width: 639px) {
    main, .brand { max-width: 600px; }
    table { font-size: 16px; }
  }
  @media (min-width: 640px) {
    main, .brand { max-width: 760px; }
    table { font-size: 16px; }
    th { font-size: 12px; }
    .stat .label { font-size: 12px; }
  }
  @media (min-width: 960px) {
    main, .brand { max-width: 1120px; }
    header { padding-top: calc(18px + env(safe-area-inset-top)); padding-bottom: 18px; }
    main { padding-top: 24px;
      grid-template-columns: minmax(300px, 1fr) minmax(420px, 1.45fr);
      grid-template-areas: "bar bar" "err err" "hero locs" "stats locs" "od od" "chart chart"; }
    .area-bar { grid-area: bar; } .area-err { grid-area: err; } .area-hero { grid-area: hero; }
    .area-stats { grid-area: stats; align-self: start; } .area-locs { grid-area: locs; } .area-chart { grid-area: chart; } .area-od { grid-area: od; }
    .area-hero { display: flex; flex-direction: column; justify-content: center; }
    td { padding: 12px 6px; }
  }
  /* Phones turned sideways: short screens, so don't pin the header and use two columns */
  @media (orientation: landscape) and (max-height: 500px) {
    header { position: static; }
    main { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr);
      grid-template-areas: "bar bar" "err err" "hero locs" "stats locs" "od od" "chart chart"; }
    .area-bar { grid-area: bar; } .area-err { grid-area: err; } .area-hero { grid-area: hero; }
    .area-stats { grid-area: stats; align-self: start; } .area-locs { grid-area: locs; } .area-chart { grid-area: chart; } .area-od { grid-area: od; }
    .big { font-size: clamp(40px, 7vw, 60px); }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header>
  <div class="brand">
    <!-- Harbor & Pine mark: a pine tree over harbor waves, in a ring -->
    <svg viewBox="0 0 64 64" role="img" aria-label="Harbor and Pine logo">
      <circle cx="32" cy="32" r="30" fill="#1B2B24" stroke="#C8862A" stroke-width="2.5"/>
      <path d="M32 11 L40 23 H36 L43 33 H38 L45 43 H19 L26 33 H21 L28 23 H24 Z" fill="#F4EFE6"/>
      <rect x="30" y="43" width="4" height="5" fill="#F4EFE6"/>
      <path d="M14 50 q4.5 -4 9 0 t9 0 t9 0 t9 0" fill="none" stroke="#C8862A" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <div>
      <h1>Harbor &amp; Pine</h1>
      <p>Restaurant Group · Owner View</p>
    </div>
  </div>
</header>

<main>
  <div class="bar area-bar">
    <span id="week" class="badge">Loading...</span>
    <span id="statusPill" class="status">
      <span class="dot" aria-hidden="true"></span>
      <span id="mode">Loading</span>
      <button id="refresh" class="refresh" type="button" aria-label="Refresh now">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
        Refresh
      </button>
    </span>
  </div>

  <div id="error" class="card err area-err" role="alert" hidden></div>

  <section class="card area-hero">
    <div class="label">Group food cost</div>
    <div id="group" class="big">-</div>
    <div id="target" class="sub"></div>
  </section>

  <section class="stats area-stats">
    <div class="card stat"><div class="label">Locations reporting</div><div id="reporting" class="val">-</div></div>
    <button id="ordersCard" class="card stat" type="button" aria-expanded="false" aria-controls="ordersDetail">
      <div class="label">Orders over $2,500 waiting on you</div><div id="orders" class="val">-</div>
      <span id="ordersMore" class="more" hidden>Show details <span class="chev" aria-hidden="true">&#9662;</span></span>
    </button>
  </section>

  <section id="ordersDetail" class="card orders-detail area-od" hidden aria-live="polite"></section>

  <section class="card area-locs">
    <h2>By location</h2>
    <table>
      <thead><tr>
        <th>Location</th>
        <th class="num"><span class="long">Food cost</span><span class="short">Cost</span></th>
        <th>Status</th>
        <th class="num"><span class="long">To approve</span><span class="short">Approve</span></th>
      </tr></thead>
      <tbody id="locs"></tbody>
    </table>
  </section>

  <section class="card chart area-chart">
    <h2>Six-week trend</h2>
    <div id="chart"></div>
  </section>
</main>
<footer>Read-only view of the Owner View tab · Updates every 60 seconds</footer>

<!-- config.js holds only the public address of your Cloudflare Worker. No API key lives in this site. -->
<script src="config.js"></script>
<script>
const CONFIG = Object.assign({ DATA_URL: "", REFRESH_MS: 60000 }, window.HP_CONFIG || {});

// Order must match the RANGES list in worker/worker.js
const KEYS = ["week", "group", "target", "reporting", "locs", "orders", "trend"];

const DEMO = {
  week: [["11/1/2026"]], group: [["30.0%"]], target: [["30.0%"]], reporting: [["5 of 6"]], orders: [["1"]],
  locs: [["Harbor","29.4%","On target","0"],["Westside","34.8%","Over target","1"],["Downtown","27.4%","On target","0"],
         ["Northgate","30.0%","On target","0"],["Eastlake","29.7%","On target","0"],["Bayview","","Not in yet","0"]],
  trend: [["9/27/2026","29.7%"],["10/4/2026","29.7%"],["10/11/2026","29.7%"],["10/18/2026","29.6%"],["10/25/2026","29.6%"],["11/1/2026","30.0%"]],
};

const $ = (id) => document.getElementById(id);
const pct = (s) => { const n = parseFloat(String(s || "").replace(/[^0-9.\-]/g, "")); return isNaN(n) ? null : n; };
const cell = (rows, r = 0, c = 0) => (rows && rows[r] && rows[r][c] != null ? String(rows[r][c]) : "");

async function fetchData(fresh) {
  const res = await fetch(CONFIG.DATA_URL + (fresh ? "?fresh=1&t=" + Date.now() : ""), { method: "GET", cache: "no-store", headers: { Accept: "application/json" } });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((body.error && (body.error.message || body.error)) || ("Request failed (" + res.status + ")"));
  const out = {};
  KEYS.forEach((k, i) => { out[k] = (body.valueRanges && body.valueRanges[i] && body.valueRanges[i].values) || []; });
  return out;
}

function render(d) {
  $("week").textContent = "Week ending " + (cell(d.week) || "-");
  const g = cell(d.group), t = cell(d.target), gn = pct(g), tn = pct(t);
  $("group").textContent = g || "-";
  $("group").className = "big " + (gn != null && tn != null ? (gn > tn ? "over" : "ok") : "");
  $("target").textContent = t ? "Target " + t + (gn != null && tn != null ? (gn > tn ? " · over target" : " · on target") : "") : "";
  $("reporting").textContent = cell(d.reporting) || "-";
  const orders = cell(d.orders) || "0";
  $("orders").textContent = orders;
  const waiting = Number(orders) > 0;
  $("ordersCard").classList.toggle("alert", waiting);
  $("ordersCard").classList.toggle("clickable", waiting);
  $("ordersCard").disabled = !waiting;
  $("ordersMore").hidden = !waiting;
  if (!waiting && ordersOpen) toggleOrders(false);

  const tbody = $("locs"); tbody.replaceChildren();
  (d.locs || []).forEach((r) => {
    if (!r || !r[0]) return;
    const tr = document.createElement("tr");
    const status = cell([r], 0, 2);
    const cls = status === "Over target" ? "over" : status === "On target" ? "ok" : "wait";
    const td = (cls2, text) => { const e = document.createElement("td"); e.className = cls2; e.textContent = text; tr.appendChild(e); return e; };
    td("", cell([r], 0, 0));
    td("num", cell([r], 0, 1) || "-");
    const tdS = document.createElement("td"); const pill = document.createElement("span");
    pill.className = "pill " + cls; pill.textContent = status || "-"; tdS.appendChild(pill); tr.appendChild(tdS);
    const tdA = td("num", cell([r], 0, 3) || "0"); if (Number(tdA.textContent) > 0) tdA.style.fontWeight = "700";
    tbody.appendChild(tr);
  });

  drawTrend((d.trend || []).filter((r) => r && r[0]).map((r) => ({ label: r[0], v: pct(r[1]) })), tn);
}

let lastTrend = null, resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (lastTrend) drawTrend(lastTrend[0], lastTrend[1]); }, 150); });
function drawTrend(points, target) {
  lastTrend = [points, target];
  const W = Math.max(260, Math.round($("chart").clientWidth || 600));
  const small = W < 360, H = W < 520 ? 210 : 260, L = small ? 40 : 46, R = 12, T = 28, B = 34, fs = small ? 11 : 13;
  const vals = points.map((p) => p.v).filter((v) => v != null).concat(target != null ? [target] : []);
  if (!vals.length) { $("chart").textContent = "No trend data yet."; return; }
  const lo = Math.floor(Math.min(...vals) - 1), hi = Math.ceil(Math.max(...vals) + 1);
  const x = (i) => L + (points.length > 1 ? i * (W - L - R) / (points.length - 1) : (W - L - R) / 2);
  const y = (v) => T + (hi - v) * (H - T - B) / (hi - lo);
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg"); svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Group food cost by week");
  const add = (tag, attrs, text) => { const e = document.createElementNS(ns, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; svg.appendChild(e); return e; };
  for (let v = lo; v <= hi; v++) {
    add("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: "#E6ECE8" });
    add("text", { x: L - 8, y: y(v) + 4, "text-anchor": "end", "font-size": fs, fill: "#5E7268" }, v + "%");
  }
  if (target != null) {
    add("line", { x1: L, x2: W - R, y1: y(target), y2: y(target), stroke: "#C8862A", "stroke-dasharray": "5 4", "stroke-width": 1.5 });
    add("text", { x: L + 6, y: y(target) - 8, "text-anchor": "start", "font-size": fs - 1, fill: "#8A5C17" }, "Target " + target + "%");
  }
  const pts = points.map((p, i) => (p.v == null ? null : [x(i), y(p.v)])).filter(Boolean);
  add("polyline", { points: pts.map((p) => p.join(",")).join(" "), fill: "none", stroke: "#24443A", "stroke-width": 3, "stroke-linejoin": "round" });
  points.forEach((p, i) => {
    // On very narrow screens, label every other week so dates don't collide
    if (!small || i % 2 === 0 || i === points.length - 1)
      add("text", { x: x(i), y: H - 12, "text-anchor": i === 0 ? "start" : (i === points.length - 1 ? "end" : "middle"), "font-size": fs, fill: "#5E7268" }, p.label.replace(/\/\d{4}$/, ""));
    if (p.v == null) return;
    const last = i === points.length - 1;
    add("circle", { cx: x(i), cy: y(p.v), r: last ? 6 : 4, fill: last ? "#C8862A" : "#24443A" });
    if (last) add("text", { x: x(i) - 10, y: y(p.v) - 12, "text-anchor": "end", "font-size": fs + 2, "font-weight": 700, fill: "#1B2B24" }, p.v.toFixed(1) + "%");
  });
  $("chart").replaceChildren(svg);
}

// ---------- Order details (opens below the orders card) ----------
const usd2 = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", minimumFractionDigits: 2, maximumFractionDigits: 2 });
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const daysSince = (d) => { const t = Date.parse(d); return t ? Math.max(0, Math.floor((Date.now() - t) / 86400000)) : null; };
const DEMO_ORDERS = { count: 1, total: 3100, orders: [{ location: "Westside", gm: "Luis", date: "10/31/2026", vendor: "Sysco",
  category: "Meat & Seafood", invoice: "SYS-58817", amount: 3100, status: "Pending", link: "" }] };
let ordersOpen = false;

async function loadOrders(fresh) {
  const box = $("ordersDetail");
  let data;
  try {
    if (!CONFIG.DATA_URL) data = DEMO_ORDERS;
    else {
      const res = await fetch(CONFIG.DATA_URL + "?view=orders" + (fresh ? "&fresh=1&t=" + Date.now() : ""), { method: "GET", cache: "no-store", headers: { Accept: "application/json" } });
      data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error((data && data.error) || ("Request failed (" + res.status + ")"));
    }
  } catch (e) {
    box.replaceChildren(el("h2", null, "Orders waiting on you"), el("p", "note", "Couldn't load the order details. " + (e instanceof TypeError ? "Check your connection." : String(e.message))));
    return;
  }
  box.replaceChildren(el("h2", null, "Orders waiting on you"));
  if (!data || !Array.isArray(data.orders)) {
    // An older data service only knows the Owner View tab
    box.appendChild(el("p", "note", "Order details need the updated data service. Deploy the new worker/worker.js to Cloudflare, then refresh."));
    return;
  }
  if (!data.orders.length) { box.appendChild(el("p", "note", "Nothing waiting. Every order over $2,500 has been approved.")); return; }
  box.appendChild(el("p", "sub", `${data.orders.length} order${data.orders.length === 1 ? "" : "s"} over $2,500 not yet approved · ${usd2.format(data.total || 0)} total`));
  data.orders.forEach((o) => {
    const row = el("div", "order");
    row.appendChild(el("div", "who", `${o.location} · ${o.vendor}`));
    row.appendChild(el("div", "amt", usd2.format(o.amount)));
    row.appendChild(el("div", "meta", `${o.category}${o.invoice ? " · Invoice " + o.invoice : ""}${o.gm ? " · GM " + o.gm : ""}`));
    const line = el("div", "meta", "Invoice date " + (o.date || "-"));
    const d = daysSince(o.date);
    if (d != null) line.appendChild(el("span", "waiting", d === 0 ? "came in today" : `waiting ${d} day${d === 1 ? "" : "s"}`));
    row.appendChild(line);
    if (o.link) { const a = el("a", "btn", "Open in Google Sheets to approve"); a.href = o.link; a.target = "_blank"; a.rel = "noopener"; row.appendChild(a); }
    box.appendChild(row);
  });
}

function toggleOrders(open) {
  ordersOpen = open;
  $("ordersCard").setAttribute("aria-expanded", String(open));
  $("ordersMore").firstChild.textContent = open ? "Hide details " : "Show details ";
  $("ordersDetail").hidden = !open;
  if (open) { $("ordersDetail").replaceChildren(el("p", "note", "Loading orders...")); loadOrders(false); }
}

function setStatus(kind, text) {
  $("statusPill").className = "status" + (kind ? " " + kind : "");
  $("mode").textContent = text;
}

const timeNow = () => new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" });
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
let busy = false;

async function refresh(fresh) {
  if (busy) return;
  busy = true;
  const manual = fresh === true;
  const btn = $("refresh");
  btn.classList.add("spin"); btn.disabled = true;
  $("error").hidden = true;
  const started = Date.now();
  let ok = false;
  try {
    if (!CONFIG.DATA_URL) {
      render(DEMO); if (ordersOpen) loadOrders(manual);
      setStatus("demo", "Demo data"); ok = true;
    } else {
      render(await fetchData(manual));
      if (ordersOpen) loadOrders(manual);
      setStatus("", "Live · " + timeNow()); ok = true;
    }
  } catch (e) {
    setStatus("error", "Not updated");
    $("error").hidden = false;
    $("error").textContent = e instanceof TypeError
      ? "Couldn't reach the data service. Check your connection, or open this page in Chrome or Safari instead of an app preview."
      : "The data service said: " + String(e.message).replace(/[.\s]+$/, "") + ".";
  }
  // Keep the spinner up long enough to see, then confirm a manual refresh
  if (manual) await wait(Math.max(0, 600 - (Date.now() - started)));
  btn.classList.remove("spin"); btn.disabled = false; busy = false;
  if (manual && ok) {
    const label = $("mode").textContent;
    $("statusPill").classList.add("flash"); $("mode").textContent = "Updated";
    await wait(1200);
    $("statusPill").classList.remove("flash"); $("mode").textContent = label;
  }
}

$("refresh").addEventListener("click", () => refresh(true));
$("ordersCard").addEventListener("click", () => toggleOrders(!ordersOpen));
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(false); }); // refresh when the phone app comes back to the front
refresh(false);
setInterval(() => refresh(false), CONFIG.REFRESH_MS);
</script>
</body>
</html>
